<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ENTROPY: GENESIS 戦闘プロトタイプ</title>
<style>
:root{--bg:#09111d;--panel:#111a2b;--card:#172235;--text:#eef4ff;--muted:#9fb0c7;--border:#2a3950;--blue:#36b8ff;--blue2:#123d58;--red:#ff6b6b;--orange:#ffb347;--green:#63d39d}
*{box-sizing:border-box}html{width:100%;overflow-x:hidden}body{margin:0;background:linear-gradient(#08111d,#111b2b);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{font-size:22px;margin:0 0 4px}.small{font-size:13px;color:var(--muted)}.badge{border:1px solid var(--blue);background:var(--blue2);padding:6px 10px;border-radius:999px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}.boardwrap{min-width:0;width:100%}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:100%;max-width:100%;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel)}.cell{position:relative;min-width:0;overflow:hidden;aspect-ratio:1;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:transparent;color:var(--text);padding:0}.cell:nth-child(8n){border-right:0}.cell:nth-last-child(-n+8){border-bottom:0}.cell.move{background:rgba(54,184,255,.16)}.cell.target{outline:3px solid var(--blue);outline-offset:-3px}.cell.hazard:after{content:"";position:absolute;inset:7%;border:2px dashed var(--orange);border-radius:8px;pointer-events:none}.cell.wall:before{content:"▰";position:absolute;inset:0;display:grid;place-items:center;color:#d1dbe7;font-size:clamp(14px,3vw,26px)}.unit{position:absolute;inset:10%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid currentColor;border-radius:12px;background:var(--card);font-size:clamp(10px,1.7vw,13px);line-height:1.05}.unit.ally{color:var(--blue)}.unit.enemy{color:var(--red)}.unit.acted{opacity:.42}.unit.cancelled{text-decoration:line-through}.hp{font-size:10px;color:var(--muted);margin-top:2px}.center{position:absolute;top:2px;right:3px;color:var(--orange);font-size:10px}.section{border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--card)}.stack>*+*{margin-top:12px}.prediction{display:grid;gap:8px;margin-top:10px}.prediction-item{border-left:3px solid var(--border);padding-left:9px}.allybar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.allychip{border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--card);color:var(--text);text-align:left}.allychip.active{border-color:var(--blue);background:var(--blue2)}.allychip.done{opacity:.45}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.action{min-height:44px;border:1px solid var(--border);border-radius:12px;padding:9px 12px;background:var(--card);color:var(--text);cursor:pointer}.action:hover:not(:disabled){border-color:var(--blue)}.action.primary{background:var(--blue);color:#07111c;border-color:var(--blue);font-weight:700}.action:disabled{opacity:.4;cursor:not-allowed}.guide{margin-top:8px}.log{max-height:150px;overflow:auto;font-size:13px;line-height:1.5;margin-top:8px}.result{border:1px solid var(--blue);background:var(--blue2);border-radius:14px;padding:14px;margin-bottom:14px}.hidden{display:none}.callout{border-left:4px solid var(--blue);background:var(--blue2);border-radius:10px;padding:10px 12px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.footer{margin-top:16px;font-size:12px;color:var(--muted)}
@media(max-width:900px){
  .app{width:100%;max-width:none;padding:10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;margin-bottom:10px}
  h1{font-size:18px;line-height:1.25}.badge{font-size:12px;padding:5px 8px}
  .layout{display:flex;flex-direction:column;gap:12px;width:100%}
  .boardwrap{order:1;width:100%;min-width:0}
  .stack{order:2;width:100%;display:grid;gap:10px}.stack>*+*{margin-top:0}
  .board{width:100%;border-radius:12px}
  .cell{aspect-ratio:1;min-width:0}
  .unit{inset:7%;border-radius:8px;font-size:11px}.hp{font-size:8px}.center{font-size:8px}
  .allybar{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:0 0 10px}
  .allychip{padding:7px 5px;min-width:0;text-align:center;font-size:12px}.allychip .small{font-size:10px;white-space:nowrap}
  .section{padding:11px;border-radius:12px}
  .prediction{grid-template-columns:1fr 1fr;gap:8px}.prediction-item{min-width:0}
  .controls{gap:7px}.action{flex:1 1 auto;min-height:46px;padding:9px 10px}
  .log{max-height:110px}.callout{margin-top:10px}.footer{margin-top:12px}
}
@media(max-width:430px){
  .top{grid-template-columns:1fr}.badge{justify-self:start;margin-top:7px}
  .prediction{grid-template-columns:1fr}
  .allybar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .unit{font-size:10px}.hp{font-size:7px}
  .small{font-size:12px}
}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><h1>ENTROPY: GENESIS 戦闘プロトタイプ</h1><div id="phaseText" class="small">敵の予告を見て、4人を自由な順番で行動させます。</div></div><span id="progress" class="badge">0 / 4 行動済み</span></div>
  <div id="result" class="result hidden"></div>
  <div id="allybar" class="allybar"></div>
  <div class="layout">
    <div class="boardwrap"><div id="board" class="board"><div style="grid-column:1/-1;padding:18px;line-height:1.7;color:#eef4ff;background:#172235">このファイルプレビューではJavaScriptが動作しないため、盤面を操作できません。公開URLをSafariまたはChromeで開いてください。</div></div><div class="small" style="margin-top:8px">破線のマスは重砲の固定砲撃範囲。敵も巻き込まれます。</div></div>
    <aside class="stack">
      <section class="section"><strong>敵フェイズ予告</strong><div id="predictions" class="prediction"></div></section>
      <section class="section"><strong>操作ガイド</strong><div id="guide" class="small guide">味方を選択してください。</div><div id="commands" class="controls"></div></section>
      <section class="section"><div class="row"><strong>行動記録</strong><button id="undo" class="action" disabled>1手戻す</button></div><div id="log" class="log">まだ行動していません。</div></section>
    </aside>
  </div>
  <div class="controls"><button id="enemyPhase" class="action primary" disabled>敵フェイズを実行</button><button id="reset" class="action">最初から</button></div>
  <div class="callout small">すべてを防ぐ必要はありません。「止める・利用する・受ける」の配分を試してください。</div>
  <div class="footer">スマホ・PC対応の共有用単体HTML。スマホではChromeまたはSafariで開いてください。</div>
</main>
<script>
(()=>{
const W=8,H=6,blast=[];for(let y=1;y<=3;y++)for(let x=3;x<=5;x++)blast.push(`${x},${y}`);
const initial=[
{id:'r',side:'ally',name:'レクト',short:'レ',x:1,y:2,hp:8,max:8,move:3,acted:false},
{id:'m',side:'ally',name:'ミレア',short:'ミ',x:0,y:3,hp:7,max:7,move:3,acted:false},
{id:'v',side:'ally',name:'ヴァルグ',short:'ヴ',x:1,y:3,hp:10,max:10,move:2,acted:false},
{id:'l',side:'ally',name:'レヴ',short:'レヴ',x:2,y:3,hp:6,max:6,move:4,acted:false},
{id:'e1',side:'enemy',name:'突撃兵A',short:'突',x:5,y:2,hp:4,max:4,cancelled:false},
{id:'e2',side:'enemy',name:'重砲ドローン',short:'砲',x:7,y:0,hp:5,max:5,cancelled:false},
{id:'e3',side:'enemy',name:'狙撃兵',short:'狙',x:7,y:3,hp:4,max:4,cancelled:false},
{id:'e4',side:'enemy',name:'指揮官',short:'指',x:6,y:5,hp:6,max:6,cancelled:false}];
let state,history=[],actionStart=null,selected=null,mode='select',logs=[];
const $=id=>document.getElementById(id),board=$('board'),guide=$('guide'),commands=$('commands'),predictions=$('predictions'),allybar=$('allybar'),enemyPhase=$('enemyPhase'),undo=$('undo'),log=$('log'),result=$('result'),phaseText=$('phaseText'),progress=$('progress');
const clone=o=>JSON.parse(JSON.stringify(o)),key=(x,y)=>`${x},${y}`,dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),inside=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const unit=id=>state.units.find(u=>u.id===id&&u.hp>0),allies=()=>state.units.filter(u=>u.side==='ally'&&u.hp>0),enemies=()=>state.units.filter(u=>u.side==='enemy'&&u.hp>0),occupied=(x,y)=>state.units.some(u=>u.hp>0&&u.x===x&&u.y===y)||state.walls.some(w=>w.x===x&&w.y===y);
function reset(){state={units:clone(initial),walls:[],guards:{},phase:'ally'};history=[];actionStart=null;selected=null;mode='select';logs=[];result.classList.add('hidden');phaseText.textContent='敵の予告を見て、4人を自由な順番で行動させます。';render()}
function start(id){if(state.phase!=='ally')return;const a=unit(id);if(!a||a.acted)return;if(selected&&selected!==id)cancel();actionStart=clone(state);selected=id;mode='move';guide.textContent=`${a.name}：移動先を選択してください。現在地でも可。`;render()}
function cancel(){if(actionStart)state=clone(actionStart);selected=null;mode='select';actionStart=null;guide.textContent='味方を選択してください。';render()}
function finish(text){const a=unit(selected);if(a)a.acted=true;history.push(clone(actionStart));logs.unshift(text);selected=null;mode='select';actionStart=null;guide.textContent='次に動かす味方を選択してください。';render()}
function moves(a){const out=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(dist(a,{x,y})<=a.move&&(!occupied(x,y)||(a.x===x&&a.y===y)))out.push(key(x,y));return out}
function targets(){const a=unit(selected);if(!a)return[];if(mode==='attack')return enemies().filter(e=>dist(a,e)===1).map(e=>key(e.x,e.y));if(mode==='pull')return enemies().filter(e=>dist(a,e)<=4).map(e=>key(e.x,e.y));if(mode==='wall'){const out=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(dist(a,{x,y})<=3&&!occupied(x,y))out.push(key(x,y));return out}if(mode==='guard')return allies().filter(t=>t.id!==a.id&&dist(a,t)<=3).map(t=>key(t.x,t.y));if(mode==='break')return enemies().filter(e=>dist(a,e)===1).map(e=>key(e.x,e.y));return[]}
function clickCell(x,y){if(state.phase!=='ally')return;const clicked=state.units.find(u=>u.hp>0&&u.x===x&&u.y===y);if(mode==='select'){if(clicked&&clicked.side==='ally')start(clicked.id);return}const a=unit(selected);if(!a)return;if(mode==='move'){if(moves(a).includes(key(x,y))){a.x=x;a.y=y;mode='command';guide.textContent=`${a.name}：コマンドを選択してください。`;render()}return}if(!targets().includes(key(x,y)))return;
if(mode==='attack'){clicked.hp-=2;let t=`${a.name}が${clicked.name}を攻撃（2ダメージ）`;if(clicked.hp<=0){clicked.cancelled=true;t+='・撃破'}finish(t)}
else if(mode==='pull'){let dx=Math.sign(a.x-clicked.x),dy=Math.sign(a.y-clicked.y),nx=clicked.x,ny=clicked.y;if(Math.abs(a.x-clicked.x)>=Math.abs(a.y-clicked.y))nx+=dx;else ny+=dy;if(inside(nx,ny)&&!occupied(nx,ny)){clicked.x=nx;clicked.y=ny;finish(`レクトが${clicked.name}を1マス引き寄せた`)}else guide.textContent='引き寄せ先が塞がれています。'}
else if(mode==='wall'){state.walls.push({x,y});finish('ミレアが防壁を展開した')}
else if(mode==='guard'){state.guards[clicked.id]=a.id;finish(`ヴァルグが${clicked.name}を護衛対象に指定した`)}
else if(mode==='break'){clicked.cancelled=true;clicked.hp-=1;finish(`レヴが${clicked.name}の行動を中断した`)}}
function btn(label,next,enabled=true,primary=false){const b=document.createElement('button');b.className='action'+(primary?' primary':'');b.textContent=label;b.disabled=!enabled;b.onclick=()=>{mode=next;guide.textContent=({attack:'隣接する敵を選択。',pull:'4マス以内の敵を選択。レクト方向へ1マス引き寄せます。',wall:'3マス以内の空きマスを選択。防壁は射線を遮ります。',guard:'3マス以内の味方を選択。次の敵フェイズの攻撃を肩代わりします。',break:'隣接する敵を選択。その敵の予告行動を中断します。'})[next]||'';render()};return b}
function renderCommands(){commands.innerHTML='';if(!selected)return;const a=unit(selected);if(mode==='move'){const b=btn('選択をやめる','x');b.onclick=cancel;commands.appendChild(b);return}if(['attack','pull','wall','guard','break'].includes(mode)){const b=btn('コマンドに戻る','command');b.onclick=()=>{mode='command';guide.textContent=`${a.name}：コマンドを選択してください。`;render()};commands.appendChild(b);return}if(mode==='command'){commands.appendChild(btn('通常攻撃','attack',enemies().some(e=>dist(a,e)===1)));if(a.id==='r')commands.appendChild(btn('重力牽引','pull',enemies().some(e=>dist(a,e)<=4),true));if(a.id==='m')commands.appendChild(btn('防壁展開','wall',true,true));if(a.id==='v')commands.appendChild(btn('護衛指定','guard',allies().some(t=>t.id!==a.id&&dist(a,t)<=3),true));if(a.id==='l')commands.appendChild(btn('ブレイク','break',enemies().some(e=>dist(a,e)===1),true));const w=btn('待機','x');w.onclick=()=>finish(`${a.name}は待機した`);commands.appendChild(w);const c=btn('移動をやり直す','x');c.onclick=cancel;commands.appendChild(c)}}
function blocked(a,b){if(a.y===b.y){const mn=Math.min(a.x,b.x),mx=Math.max(a.x,b.x);return state.walls.some(w=>w.y===a.y&&w.x>mn&&w.x<mx)}if(a.x===b.x){const mn=Math.min(a.y,b.y),mx=Math.max(a.y,b.y);return state.walls.some(w=>w.x===a.x&&w.y>mn&&w.y<mx)}return false}
function sniperTarget(){const sn=unit('e3');if(!sn)return null;const c=allies().filter(u=>(u.x===sn.x||u.y===sn.y)&&!blocked(sn,u));c.sort((a,b)=>a.hp-b.hp);return c[0]||null}
function forecast(){const out=[],cmd=unit('e4');out.push(['1 指揮官',!cmd?'撃破済み':cmd.cancelled?'行動中断':'全敵の攻撃力を強化']);const ass=unit('e1'),r=unit('r');if(!ass)out.push(['2 突撃兵A','撃破済み']);else if(ass.cancelled)out.push(['2 突撃兵A','行動中断']);else if(r)out.push(['2 突撃兵A',dist(ass,r)<=2?'レクトへ接近し攻撃':'レクトへ接近・移動のみ']);const hits=state.units.filter(u=>u.hp>0&&blast.includes(key(u.x,u.y))).map(u=>u.name);out.push(['3 重砲ドローン',unit('e2')?.cancelled?'行動中断':`固定地点を砲撃${hits.length?'（'+hits.join('・')+'）':'（命中なし）'}`]);const sn=unit('e3');if(!sn)out.push(['4 狙撃兵','撃破済み']);else if(sn.cancelled)out.push(['4 狙撃兵','行動中断']);else{const t=sniperTarget();out.push(['4 狙撃兵',t?`${t.name}を狙撃`:'射線なし・不発'])}return out}
function renderPred(){predictions.innerHTML='';forecast().forEach(([n,t])=>{const d=document.createElement('div');d.className='prediction-item';d.innerHTML=`<strong>${n}</strong><div class="small">${t}</div>`;predictions.appendChild(d)})}
function renderBoard(){board.innerHTML='';const mv=selected&&mode==='move'?moves(unit(selected)):[],tg=selected&&['attack','pull','wall','guard','break'].includes(mode)?targets():[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=document.createElement('button');c.className='cell';const k=key(x,y);if(mv.includes(k))c.classList.add('move');if(tg.includes(k))c.classList.add('target');if(blast.includes(k))c.classList.add('hazard');if(state.walls.some(w=>w.x===x&&w.y===y))c.classList.add('wall');const u=state.units.find(q=>q.hp>0&&q.x===x&&q.y===y);if(u){const d=document.createElement('div');d.className=`unit ${u.side}${u.acted?' acted':''}${u.cancelled?' cancelled':''}`;d.innerHTML=`<span>${u.short}</span><span class="hp">${u.hp}/${u.max}</span>`;c.appendChild(d)}if(x===4&&y===2){const s=document.createElement('span');s.className='center';s.textContent='中心';c.appendChild(s)}c.onclick=()=>clickCell(x,y);board.appendChild(c)}}
function renderAllies(){allybar.innerHTML='';state.units.filter(u=>u.side==='ally').forEach(a=>{const b=document.createElement('button');b.className=`allychip${selected===a.id?' active':''}${a.acted?' done':''}`;b.disabled=state.phase!=='ally'||a.acted||a.hp<=0;b.innerHTML=`<strong>${a.name}</strong><div class="small">HP ${Math.max(0,a.hp)}/${a.max}${a.acted?'・行動済み':''}</div>`;b.onclick=()=>start(a.id);allybar.appendChild(b)})}
function guardFor(id){const g=state.guards[id];return g?unit(g):null}
function stepToward(m,t){const dx=Math.sign(t.x-m.x),dy=Math.sign(t.y-m.y),opts=Math.abs(t.x-m.x)>=Math.abs(t.y-m.y)?[[m.x+dx,m.y],[m.x,m.y+dy]]:[[m.x,m.y+dy],[m.x+dx,m.y]];for(const [x,y] of opts)if(inside(x,y)&&!occupied(x,y)){m.x=x;m.y=y;return}}
function damage(t,amount,label,events){if(!t||t.hp<=0)return;const g=guardFor(t.id),a=g||t;a.hp-=amount;events.push(`${label}：${a.name}に${amount}ダメージ${g?'（護衛）':''}`);if(a.hp<=0)events.push(`${a.name}が戦闘不能`)}
function enemyTurn(){if(state.units.filter(u=>u.side==='ally'&&u.acted).length<4)return;state.phase='enemy';const events=[];let buff=0,inter=0;const cmd=unit('e4');if(cmd){if(cmd.cancelled){events.push('指揮官：行動中断');inter++}else{buff=1;events.push('指揮官：敵全体を強化')}}const ass=unit('e1'),r=unit('r');if(ass){if(ass.cancelled){events.push('突撃兵A：行動中断');inter++}else if(r){stepToward(ass,r);if(dist(ass,r)===1)damage(r,3+buff,'突撃兵A',events);else{events.push('突撃兵A：移動のみ');inter++}}}const gun=unit('e2');if(gun){if(gun.cancelled){events.push('重砲ドローン：行動中断');inter++}else{const victims=state.units.filter(u=>u.hp>0&&blast.includes(key(u.x,u.y)));if(victims.some(v=>v.side==='enemy'))inter++;if(!victims.length)events.push('重砲ドローン：砲撃は命中なし');victims.forEach(v=>{v.hp-=3+buff;events.push(`重砲：${v.name}に${3+buff}ダメージ${v.side==='enemy'?'（敵を巻き込み）':''}`)})}}const sn=unit('e3');if(sn){if(sn.cancelled){events.push('狙撃兵：行動中断');inter++}else{const t=sniperTarget();if(t)damage(t,2+buff,'狙撃兵',events);else{events.push('狙撃兵：射線なし・不発');inter++}}}state.phase='done';logs=events.concat(logs);const down=state.units.filter(u=>u.side==='ally'&&u.hp<=0).length,enemyHit=events.filter(e=>e.includes('敵を巻き込み')).length;result.classList.remove('hidden');result.innerHTML=`<strong>敵フェイズ終了</strong><div style="margin-top:8px">介入成立：<strong>${inter}</strong>件　敵巻き込み：<strong>${enemyHit}</strong>件　味方戦闘不能：<strong>${down}</strong>人</div><div class="small" style="margin-top:8px">別の順番や、あえて被害を受ける判断も試せます。</div>`;phaseText.textContent='敵フェイズの結果を確認してください。';render()}
function undoLast(){if(selected){cancel();return}if(!history.length||state.phase!=='ally')return;state=history.pop();logs.shift();guide.textContent='直前の味方行動を戻しました。';render()}
function render(){renderBoard();renderPred();renderCommands();renderAllies();const n=state.units.filter(u=>u.side==='ally'&&u.acted).length;progress.textContent=`${n} / 4 行動済み`;enemyPhase.disabled=n<4||state.phase!=='ally';undo.disabled=(history.length===0&&!selected)||state.phase!=='ally';log.innerHTML=logs.length?logs.map(x=>`<div>・${x}</div>`).join(''):'まだ行動していません。'}
enemyPhase.onclick=enemyTurn;$('reset').onclick=reset;undo.onclick=undoLast;reset();
})();
</script>
</body>
</html>
