<style>

*{box-sizing:border-box}html{width:100%;overflow-x:hidden}body{margin:0;background:linear-gradient(#07101b,#111b2b);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}h1{font-size:22px;margin:0 0 4px}.small{font-size:13px;color:var(--muted)}.badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.badge{border:1px solid var(--blue);background:var(--blue2);padding:6px 10px;border-radius:999px;white-space:nowrap;font-size:13px}.badge.objective{border-color:var(--green);background:rgba(99,211,157,.12)}.phase-banner{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:9px 12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.phase-banner.enemy{border-color:var(--red);background:rgba(255,107,107,.08)}.phase-banner strong{font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.boardwrap{min-width:0;width:100%}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:100%;max-width:100%;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel)}.cell{position:relative;min-width:0;overflow:hidden;aspect-ratio:1;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:transparent;color:var(--text);padding:0}.cell:nth-child(8n){border-right:0}.cell:nth-last-child(-n+8){border-bottom:0}.cell.move{background:rgba(54,184,255,.17)}.cell.target{outline:3px solid var(--blue);outline-offset:-3px}.cell.hazard:after{content:"";position:absolute;inset:7%;border:2px dashed var(--orange);border-radius:8px;pointer-events:none}.cell.flash{animation:blast .55s ease-in-out 2;background:rgba(255,179,71,.38)}@keyframes blast{50%{background:rgba(255,179,71,.76)}}.cell.wall:before{content:"▰";position:absolute;inset:0;display:grid;place-items:center;color:#d1dbe7;font-size:clamp(14px,3vw,26px)}.cell.terminal:before{content:"端";position:absolute;inset:13%;display:grid;place-items:center;border:2px solid var(--green);border-radius:10px;color:var(--green);font-weight:800;background:rgba(99,211,157,.09)}.cell.terminal.complete:before{content:"起";background:rgba(99,211,157,.24)}.unit{position:absolute;inset:10%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid currentColor;border-radius:12px;background:var(--card);font-size:clamp(10px,1.7vw,13px);line-height:1.05;z-index:2}.unit.ally{color:var(--blue)}.unit.enemy{color:var(--red)}.unit.acted{opacity:.42}.unit.cancelled{text-decoration:line-through}.unit.active-enemy{animation:pulse 1s infinite;box-shadow:0 0 0 3px rgba(255,107,107,.25)}@keyframes pulse{50%{transform:scale(1.08)}}.hp{font-size:10px;color:var(--muted);margin-top:2px}.center{position:absolute;top:2px;right:3px;color:var(--orange);font-size:10px}.section{border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--card)}.stack>*+*{margin-top:12px}.prediction{display:grid;gap:8px;margin-top:10px}.prediction-item{border-left:3px solid var(--border);padding:8px 8px 8px 10px;border-radius:0 8px 8px 0}.prediction-item.active{border-left-color:var(--red);background:rgba(255,107,107,.09)}.prediction-item.done{opacity:.45}.prediction-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.spd{font-size:11px;color:var(--muted)}.allybar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.allychip{border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--card);color:var(--text);text-align:left}.allychip.active{border-color:var(--blue);background:var(--blue2)}.allychip.done{opacity:.45}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.action{min-height:44px;border:1px solid var(--border);border-radius:12px;padding:9px 12px;background:var(--card);color:var(--text);cursor:pointer}.action:hover:not(:disabled){border-color:var(--blue)}.action.primary{background:var(--blue);color:#07111c;border-color:var(--blue);font-weight:700}.action:disabled{opacity:.4;cursor:not-allowed}.guide{margin-top:8px}.log{max-height:180px;overflow:auto;font-size:13px;line-height:1.55;margin-top:8px}.result{border:1px solid var(--blue);background:var(--blue2);border-radius:14px;padding:14px;margin-bottom:12px}.result.win{border-color:var(--green);background:rgba(99,211,157,.13)}.result.lose{border-color:var(--red);background:rgba(255,107,107,.11)}.hidden{display:none}.callout{border-left:4px solid var(--green);background:rgba(99,211,157,.1);border-radius:10px;padding:10px 12px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.footer{margin-top:16px;font-size:12px;color:var(--muted)}.objective-track{height:10px;border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-top:8px;background:var(--panel)}.objective-fill{height:100%;width:0;background:var(--green);transition:width .25s}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}.legend span{display:inline-flex;gap:5px;align-items:center}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.dot.hazard{border:2px dashed var(--orange)}.dot.terminal{border:2px solid var(--green)}

<body>
<main class="app">
  <div class="top">
    <div><h1>ENTROPY: GENESIS 戦闘プロトタイプ v2.1</h1><div class="small">3ターン以内にミレアが制御端末を2回操作してください。</div></div>
    <div class="badges"><span id="turnBadge" class="badge">TURN 1 / 3</span><span id="progressBadge" class="badge">0 / 4 行動済み</span><span id="objectiveBadge" class="badge objective">端末 0 / 2</span></div>
  </div>
  <div id="phaseBanner" class="phase-banner"><strong id="phaseText">味方フェイズ</strong><span id="phaseSub" class="small">敵の予告を見て、4人を自由な順番で行動させます。</span></div>
  <div id="result" class="result hidden"></div>
  <div id="allybar" class="allybar"></div>
  <div class="layout">
    <div class="boardwrap">
      <div id="board" class="board"></div>
      <div class="legend small"><span><i class="dot hazard"></i>重砲の固定砲撃範囲</span><span><i class="dot terminal"></i>制御端末</span></div>
    </div>
    <aside class="stack">
      <section class="section"><strong>敵フェイズ予告（素早さ順）</strong><div id="predictions" class="prediction"></div></section>
      <section class="section"><strong>作戦目標</strong><div class="small" style="margin-top:6px">ミレアを端末マスへ移動させ、「端末操作」を2ターン実行。</div><div class="objective-track"><div id="objectiveFill" class="objective-fill"></div></div></section>
      <section class="section"><strong>操作ガイド</strong><div id="guide" class="small guide">味方を選択してください。</div><div id="commands" class="controls"></div></section>
      <section class="section"><div class="row"><strong>行動記録</strong><button id="undo" class="action" disabled>1手戻す</button></div><div id="log" class="log">まだ行動していません。</div></section>
    </aside>
  </div>
  <div class="controls"><button id="enemyPhase" class="action primary" disabled>敵フェイズを実行</button><button id="reset" class="action">最初から</button></div>
  <div class="callout small">敵の攻撃をすべて止める必要はありません。端末操作に使う行動を残しつつ、「止める・利用する・受ける」を選びます。</div>
  <div class="footer">第2.1版：予告計算と操作UIの描画停止を修正。</div>
</main>
<script>
(()=>{
const W=8,H=6,terminal={x:4,y:4};
const initial=[
{id:'r',side:'ally',name:'レクト',short:'レ',x:1,y:2,hp:8,max:8,move:3,acted:false},
{id:'m',side:'ally',name:'ミレア',short:'ミ',x:0,y:3,hp:7,max:7,move:3,acted:false},
{id:'v',side:'ally',name:'ヴァルグ',short:'ヴ',x:1,y:3,hp:10,max:10,move:2,acted:false},
{id:'l',side:'ally',name:'レヴ',short:'レヴ',x:2,y:4,hp:6,max:6,move:4,acted:false},
{id:'e1',side:'enemy',name:'突撃兵A',short:'突',x:5,y:2,hp:5,max:5,spd:7,cancelled:false},
{id:'e2',side:'enemy',name:'重砲ドローン',short:'砲',x:7,y:0,hp:6,max:6,spd:3,cancelled:false},
{id:'e3',side:'enemy',name:'狙撃兵',short:'狙',x:7,y:3,hp:5,max:5,spd:6,cancelled:false},
{id:'e4',side:'enemy',name:'指揮官',short:'指',x:6,y:5,hp:7,max:7,spd:9,cancelled:false}
];
let state,history=[],actionStart=null,selected=null,mode='select',logs=[];
const $=id=>document.getElementById(id),board=$('board'),guide=$('guide'),commands=$('commands'),predictions=$('predictions'),allybar=$('allybar'),enemyPhase=$('enemyPhase'),undo=$('undo'),log=$('log'),result=$('result'),phaseText=$('phaseText'),phaseSub=$('phaseSub'),phaseBanner=$('phaseBanner'),turnBadge=$('turnBadge'),progressBadge=$('progressBadge'),objectiveBadge=$('objectiveBadge'),objectiveFill=$('objectiveFill');
const clone=o=>JSON.parse(JSON.stringify(o)),key=(x,y)=>`${x},${y}`,dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),inside=(x,y)=>x>=0&&y>=0&&x<W&&y<H,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const unit=(id,s=state)=>s.units.find(u=>u.id===id&&u.hp>0),allies=(s=state)=>s.units.filter(u=>u.side==='ally'&&u.hp>0),enemies=(s=state)=>s.units.filter(u=>u.side==='enemy'&&u.hp>0);
function occupied(x,y,s=state,ignoreId=null){return s.units.some(u=>u.hp>0&&u.id!==ignoreId&&u.x===x&&u.y===y)||s.walls.some(w=>w.x===x&&w.y===y)}
function blastCenterForTurn(t){return t===1?{x:4,y:2}:t===2?{x:5,y:3}:{x:5,y:4}}
function blastCellsForTurn(t){const c=blastCenterForTurn(t),out=[];for(let y=c.y-1;y<=c.y+1;y++)for(let x=c.x-1;x<=c.x+1;x++)if(inside(x,y))out.push(key(x,y));return out}
function makeIntents(){const target=state.turn===1?'r':'m';return [
{enemyId:'e4',type:'buff',spd:9,label:'全敵の攻撃力を強化'},
{enemyId:'e1',type:'assault',spd:7,targetId:target,label:`${target==='r'?'レクト':'ミレア'}へ接近・攻撃`},
{enemyId:'e3',type:'sniper',spd:6,label:'射線上のHPが最も低い味方を狙撃'},
{enemyId:'e2',type:'artillery',spd:3,center:blastCenterForTurn(state.turn),label:'予告地点を範囲砲撃'}
].sort((a,b)=>b.spd-a.spd)}
function reset(){state={units:clone(initial),walls:[],guards:{},phase:'ally',turn:1,maxTurns:3,terminalProgress:0,intents:[],activeEnemy:null,doneEnemies:[],flashCells:[]};state.intents=makeIntents();history=[];actionStart=null;selected=null;mode='select';logs=[];result.className='result hidden';guide.textContent='味方を選択してください。';render()}
function isMissionOver(){return state.phase==='win'||state.phase==='lose'}
function start(id){if(state.phase!=='ally')return;const a=unit(id);if(!a||a.acted)return;if(selected&&selected!==id)cancel();actionStart=clone(state);selected=id;mode='move';guide.textContent=`${a.name}：移動先を選択してください。現在地でも可。`;render()}
function cancel(){if(actionStart)state=clone(actionStart);selected=null;mode='select';actionStart=null;guide.textContent='味方を選択してください。';render()}
function finish(text){const a=unit(selected);if(a)a.acted=true;history.push(clone(actionStart));logs.unshift(text);selected=null;mode='select';actionStart=null;guide.textContent='次に動かす味方を選択してください。';if(state.terminalProgress>=2){victory();return}render()}
function moveCells(a){const seen=new Map([[key(a.x,a.y),0]]),q=[[a.x,a.y]];while(q.length){const [x,y]=q.shift(),d=seen.get(key(x,y));if(d>=a.move)continue;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!inside(nx,ny)||seen.has(k))continue;if(occupied(nx,ny,state,a.id))continue;seen.set(k,d+1);q.push([nx,ny])}}return [...seen.keys()]}
function targets(){const a=unit(selected);if(!a)return[];if(mode==='attack')return enemies().filter(e=>dist(a,e)===1).map(e=>key(e.x,e.y));if(mode==='pull')return enemies().filter(e=>dist(a,e)<=4).map(e=>key(e.x,e.y));if(mode==='wall'){const out=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(dist(a,{x,y})<=3&&!occupied(x,y))out.push(key(x,y));return out}if(mode==='guard')return allies().filter(t=>t.id!==a.id&&dist(a,t)<=3).map(t=>key(t.x,t.y));if(mode==='break')return enemies().filter(e=>dist(a,e)===1).map(e=>key(e.x,e.y));return[]}
function clickCell(x,y){if(state.phase!=='ally')return;const clicked=state.units.find(u=>u.hp>0&&u.x===x&&u.y===y);if(mode==='select'){if(clicked&&clicked.side==='ally')start(clicked.id);return}const a=unit(selected);if(!a)return;if(mode==='move'){if(moveCells(a).includes(key(x,y))){a.x=x;a.y=y;mode='command';guide.textContent=`${a.name}：コマンドを選択してください。`;render()}return}if(!targets().includes(key(x,y)))return;
if(mode==='attack'){clicked.hp-=2;let t=`${a.name}が${clicked.name}を攻撃（2ダメージ）`;if(clicked.hp<=0){clicked.cancelled=true;t+='・撃破'}finish(t)}
else if(mode==='pull'){let dx=Math.sign(a.x-clicked.x),dy=Math.sign(a.y-clicked.y),nx=clicked.x,ny=clicked.y;if(Math.abs(a.x-clicked.x)>=Math.abs(a.y-clicked.y))nx+=dx;else ny+=dy;if(inside(nx,ny)&&!occupied(nx,ny,state,clicked.id)){clicked.x=nx;clicked.y=ny;finish(`レクトが${clicked.name}を1マス引き寄せた`)}else guide.textContent='引き寄せ先が塞がれています。'}
else if(mode==='wall'){state.walls.push({x,y});finish('ミレアが防壁を展開した')}
else if(mode==='guard'){state.guards[clicked.id]=a.id;finish(`ヴァルグが${clicked.name}を護衛対象に指定した`)}
else if(mode==='break'){clicked.cancelled=true;clicked.hp-=1;let t=`レヴが${clicked.name}の行動を中断した`;if(clicked.hp<=0)t+='・撃破';finish(t)}}
function btn(label,next,enabled=true,primary=false){const b=document.createElement('button');b.className='action'+(primary?' primary':'');b.textContent=label;b.disabled=!enabled;b.onclick=()=>{mode=next;guide.textContent=({attack:'隣接する敵を選択。',pull:'4マス以内の敵を選択。レクト方向へ1マス引き寄せます。',wall:'3マス以内の空きマスを選択。防壁は次の味方フェイズ開始時に消えます。',guard:'3マス以内の味方を選択。次の敵フェイズの攻撃を肩代わりします。',break:'隣接する敵を選択。その敵の予告行動を中断します。'})[next]||'';render()};return b}
function renderCommands(){commands.innerHTML='';if(!selected||state.phase!=='ally')return;const a=unit(selected);if(mode==='move'){const b=btn('選択をやめる','x');b.onclick=cancel;commands.appendChild(b);return}if(['attack','pull','wall','guard','break'].includes(mode)){const b=btn('コマンドに戻る','command');b.onclick=()=>{mode='command';guide.textContent=`${a.name}：コマンドを選択してください。`;render()};commands.appendChild(b);return}if(mode==='command'){
commands.appendChild(btn('通常攻撃','attack',enemies().some(e=>dist(a,e)===1)));
if(a.id==='r')commands.appendChild(btn('重力牽引','pull',enemies().some(e=>dist(a,e)<=4),true));
if(a.id==='m')commands.appendChild(btn('防壁展開','wall',true,true));
if(a.id==='v')commands.appendChild(btn('護衛指定','guard',allies().some(t=>t.id!==a.id&&dist(a,t)<=3),true));
if(a.id==='l')commands.appendChild(btn('ブレイク','break',enemies().some(e=>dist(a,e)===1),true));
if(a.id==='m'&&a.x===terminal.x&&a.y===terminal.y){const op=btn(`端末操作（${state.terminalProgress+1}/2）`,'x',true,true);op.onclick=()=>{state.terminalProgress++;finish(`ミレアが制御端末を操作した（${state.terminalProgress}/2）`)};commands.appendChild(op)}
const w=btn('待機','x');w.onclick=()=>finish(`${a.name}は待機した`);commands.appendChild(w);const c=btn('移動をやり直す','x');c.onclick=cancel;commands.appendChild(c)}}
function blocked(a,b,s=state){if(a.y===b.y){const mn=Math.min(a.x,b.x),mx=Math.max(a.x,b.x);return s.walls.some(w=>w.y===a.y&&w.x>mn&&w.x<mx)}if(a.x===b.x){const mn=Math.min(a.y,b.y),mx=Math.max(a.y,b.y);return s.walls.some(w=>w.x===a.x&&w.y>mn&&w.y<mx)}return false}
function sniperTarget(s=state){const sn=unit('e3',s);if(!sn)return null;const c=allies(s).filter(u=>(u.x===sn.x||u.y===sn.y)&&!blocked(sn,u,s));c.sort((a,b)=>a.hp-b.hp||dist(sn,a)-dist(sn,b));return c[0]||null}
function reachableAfterSteps(m,t,steps,s=state){const copy=clone(s),mc=unit(m.id,copy),tc=unit(t.id,copy);for(let i=0;i<steps;i++)stepToward(mc,tc,copy);return dist(mc,tc)===1}
function forecastSequence(){
  const sim=clone(state),out={};
  const done=Array.isArray(state.doneEnemies)?state.doneEnemies:[];
  let buff=0;
  const simUnit=id=>sim.units.find(u=>u.id===id&&u.hp>0);
  const simAllies=()=>sim.units.filter(u=>u.side==='ally'&&u.hp>0);
  const simOccupied=(x,y,ignoreId=null)=>sim.units.some(u=>u.hp>0&&u.id!==ignoreId&&u.x===x&&u.y===y)||(Array.isArray(sim.walls)&&sim.walls.some(w=>w.x===x&&w.y===y));
  const simStepToward=(m,t)=>{const dx=Math.sign(t.x-m.x),dy=Math.sign(t.y-m.y),opts=Math.abs(t.x-m.x)>=Math.abs(t.y-m.y)?[[m.x+dx,m.y],[m.x,m.y+dy]]:[[m.x,m.y+dy],[m.x+dx,m.y]];for(const [x,y] of opts){if(inside(x,y)&&!simOccupied(x,y,m.id)){m.x=x;m.y=y;return true}}return false};
  const simGuard=id=>{const gid=sim.guards&&sim.guards[id];return gid?simUnit(gid):null};
  const simBlocked=(a,b)=>{const walls=Array.isArray(sim.walls)?sim.walls:[];if(a.y===b.y){const mn=Math.min(a.x,b.x),mx=Math.max(a.x,b.x);return walls.some(w=>w.y===a.y&&w.x>mn&&w.x<mx)}if(a.x===b.x){const mn=Math.min(a.y,b.y),mx=Math.max(a.y,b.y);return walls.some(w=>w.x===a.x&&w.y>mn&&w.y<mx)}return false};
  const simSniperTarget=()=>{const sn=simUnit('e3');if(!sn)return null;const c=simAllies().filter(u=>(u.x===sn.x||u.y===sn.y)&&!simBlocked(sn,u));c.sort((a,b)=>a.hp-b.hp||dist(sn,a)-dist(sn,b));return c[0]||null};
  for(const intent of (Array.isArray(state.intents)?state.intents:[])){
    if(done.includes(intent.enemyId)){out[intent.enemyId]='実行済み';continue}
    const e=simUnit(intent.enemyId);
    if(!e){out[intent.enemyId]='撃破済み';continue}
    if(e.cancelled){out[intent.enemyId]='行動中断';continue}
    if(intent.type==='buff'){buff=1;out[intent.enemyId]='全敵の攻撃力を強化';continue}
    if(intent.type==='assault'){
      const t=simUnit(intent.targetId);if(!t){out[intent.enemyId]='対象不在で不発';continue}
      for(let i=0;i<2;i++){if(dist(e,t)===1)break;simStepToward(e,t)}
      if(dist(e,t)===1){const g=simGuard(t.id),r=g||t;r.hp-=3+buff;out[intent.enemyId]=`${r.name}に${3+buff}ダメージ${g?'（護衛）':''}`}else out[intent.enemyId]=`${t.name}へ接近・移動のみ`;
      continue
    }
    if(intent.type==='sniper'){
      const t=simSniperTarget();if(t){const g=simGuard(t.id),r=g||t;r.hp-=2+buff;out[intent.enemyId]=`${r.name}を狙撃・${2+buff}ダメージ${g?'（護衛）':''}`}else out[intent.enemyId]='射線なし・不発';
      continue
    }
    if(intent.type==='artillery'){
      const cells=blastCellsForTurn(state.turn),victims=sim.units.filter(u=>u.hp>0&&cells.includes(key(u.x,u.y)));
      if(!victims.length)out[intent.enemyId]='固定地点を砲撃（命中なし）';else{out[intent.enemyId]=`固定地点を砲撃（${victims.map(v=>v.name).join('・')}）`;victims.forEach(v=>v.hp-=3+buff)}
    }
  }
  return out
}
function renderPred(){predictions.innerHTML='';try{const forecast=forecastSequence(),done=Array.isArray(state.doneEnemies)?state.doneEnemies:[];(Array.isArray(state.intents)?state.intents:[]).forEach((i,index)=>{const e=unit(i.enemyId),base=initial.find(u=>u.id===i.enemyId),d=document.createElement('div');d.className='prediction-item'+(state.activeEnemy===i.enemyId?' active':'')+(done.includes(i.enemyId)?' done':'');d.innerHTML=`<div class="prediction-head"><strong>${index+1} ${e?e.name:(base?base.name:'敵')}</strong><span class="spd">SPD ${i.spd}</span></div><div class="small">${forecast[i.enemyId]||i.label||'行動予告'}</div>`;predictions.appendChild(d)})}catch(err){console.error('Prediction render error:',err);predictions.innerHTML='<div class="small">予告表示を再計算できませんでした。盤面操作は続行できます。</div>'}}
function renderBoard(){board.innerHTML='';const mv=selected&&mode==='move'?moveCells(unit(selected)):[],tg=selected&&['attack','pull','wall','guard','break'].includes(mode)?targets():[],hazards=blastCellsForTurn(state.turn);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=document.createElement('button');c.className='cell';const k=key(x,y);if(mv.includes(k))c.classList.add('move');if(tg.includes(k))c.classList.add('target');if(hazards.includes(k))c.classList.add('hazard');if(state.flashCells.includes(k))c.classList.add('flash');if(state.walls.some(w=>w.x===x&&w.y===y))c.classList.add('wall');if(x===terminal.x&&y===terminal.y)c.classList.add('terminal',state.terminalProgress>=2?'complete':'');const u=state.units.find(q=>q.hp>0&&q.x===x&&q.y===y);if(u){const d=document.createElement('div');d.className=`unit ${u.side}${u.acted?' acted':''}${u.cancelled?' cancelled':''}${state.activeEnemy===u.id?' active-enemy':''}`;d.innerHTML=`<span>${u.short}</span><span class="hp">${u.hp}/${u.max}</span>`;c.appendChild(d)}const center=blastCenterForTurn(state.turn);if(x===center.x&&y===center.y){const s=document.createElement('span');s.className='center';s.textContent='砲撃';c.appendChild(s)}c.onclick=()=>clickCell(x,y);board.appendChild(c)}}
function renderAllies(){allybar.innerHTML='';state.units.filter(u=>u.side==='ally').forEach(a=>{const b=document.createElement('button');b.className=`allychip${selected===a.id?' active':''}${a.acted?' done':''}`;b.disabled=state.phase!=='ally'||a.acted||a.hp<=0;b.innerHTML=`<strong>${a.name}</strong><div class="small">HP ${Math.max(0,a.hp)}/${a.max}${a.acted?'・行動済み':''}</div>`;b.onclick=()=>start(a.id);allybar.appendChild(b)})}
function guardFor(id,s=state){const g=s.guards[id];return g?unit(g,s):null}
function stepToward(m,t,s=state){const dx=Math.sign(t.x-m.x),dy=Math.sign(t.y-m.y),opts=Math.abs(t.x-m.x)>=Math.abs(t.y-m.y)?[[m.x+dx,m.y],[m.x,m.y+dy]]:[[m.x,m.y+dy],[m.x+dx,m.y]];for(const [x,y] of opts)if(inside(x,y)&&!occupied(x,y,s,m.id)){m.x=x;m.y=y;return true}return false}
function applyDamage(t,amount,label){if(!t||t.hp<=0)return;const g=guardFor(t.id),a=g||t;a.hp-=amount;logs.unshift(`${label}：${a.name}に${amount}ダメージ${g?'（護衛成立）':''}`);if(g)logs.unshift(`介入：${g.name}が${t.name}を護衛`);if(a.hp<=0)logs.unshift(`${a.name}が戦闘不能`)}
function checkDefeat(){const r=unit('r'),m=unit('m');if(!r||!m||allies().length===0){defeat(!r?'レクトが戦闘不能':!m?'ミレアが戦闘不能':'味方が全滅');return true}return false}
function victory(){state.phase='win';selected=null;mode='select';result.className='result win';result.innerHTML='<strong>MISSION COMPLETE</strong><div style="margin-top:7px">制御端末の起動に成功しました。</div><div class="small" style="margin-top:6px">敵全滅ではなく、目的達成を優先して勝利しています。</div>';render()}
function defeat(reason){state.phase='lose';selected=null;mode='select';result.className='result lose';result.innerHTML=`<strong>MISSION FAILED</strong><div style="margin-top:7px">${reason}</div>`;render()}
async function executeIntent(intent,buff){const e=unit(intent.enemyId);state.activeEnemy=intent.enemyId;render();await sleep(520);if(!e){logs.unshift(`${initial.find(u=>u.id===intent.enemyId).name}：撃破済み`);return buff}if(e.cancelled){logs.unshift(`${e.name}：行動中断`);return buff}
if(intent.type==='buff'){logs.unshift(`${e.name}：敵全体を強化`);return 1}
if(intent.type==='assault'){const t=unit(intent.targetId);if(!t){logs.unshift(`${e.name}：対象不在で不発`);return buff}for(let i=0;i<2;i++){if(dist(e,t)===1)break;stepToward(e,t);render();await sleep(330)}if(dist(e,t)===1)applyDamage(t,3+buff,e.name);else logs.unshift(`${e.name}：移動のみ`);return buff}
if(intent.type==='sniper'){const t=sniperTarget();if(t)applyDamage(t,2+buff,e.name);else logs.unshift(`${e.name}：射線なし・不発`);return buff}
if(intent.type==='artillery'){const cells=blastCellsForTurn(state.turn);state.flashCells=cells;render();await sleep(650);const victims=state.units.filter(u=>u.hp>0&&cells.includes(key(u.x,u.y)));if(!victims.length)logs.unshift(`${e.name}：砲撃は命中なし`);victims.forEach(v=>{v.hp-=3+buff;logs.unshift(`${e.name}：${v.name}に${3+buff}ダメージ${v.side==='enemy'?'（敵を巻き込み）':''}`);if(v.hp<=0)logs.unshift(`${v.name}が戦闘不能`)});state.flashCells=[];return buff}return buff}
async function enemyTurn(){if(state.phase!=='ally'||state.units.filter(u=>u.side==='ally'&&u.acted).length<4)return;state.phase='enemy';selected=null;mode='select';history=[];state.doneEnemies=[];phaseSub.textContent='敵が素早さ順に行動しています。';render();let buff=0;for(const intent of state.intents){buff=await executeIntent(intent,buff);state.doneEnemies.push(intent.enemyId);state.activeEnemy=null;render();await sleep(420);if(checkDefeat())return}if(state.turn>=state.maxTurns){defeat('制限ターン内に端末を起動できませんでした');return}state.turn++;state.phase='ally';state.walls=[];state.guards={};state.activeEnemy=null;state.doneEnemies=[];state.flashCells=[];state.units.forEach(u=>{if(u.side==='ally')u.acted=false;if(u.side==='enemy')u.cancelled=false});state.intents=makeIntents();history=[];actionStart=null;selected=null;mode='select';logs.unshift(`TURN ${state.turn}：新しい敵行動を観測`);guide.textContent='味方を選択してください。';render()}
function undoLast(){if(selected){cancel();return}if(!history.length||state.phase!=='ally')return;state=history.pop();logs.shift();selected=null;mode='select';actionStart=null;guide.textContent='直前の味方行動を戻しました。';render()}
function render(){renderBoard();renderAllies();renderCommands();renderPred();const n=state.units.filter(u=>u.side==='ally'&&u.acted).length;turnBadge.textContent=`TURN ${state.turn} / ${state.maxTurns}`;progressBadge.textContent=`${n} / 4 行動済み`;objectiveBadge.textContent=`端末 ${state.terminalProgress} / 2`;objectiveFill.style.width=`${state.terminalProgress*50}%`;enemyPhase.disabled=n<4||state.phase!=='ally';undo.disabled=(history.length===0&&!selected)||state.phase!=='ally';log.innerHTML=logs.length?logs.map(x=>`<div>・${x}</div>`).join(''):'まだ行動していません。';phaseBanner.classList.toggle('enemy',state.phase==='enemy');if(state.phase==='ally'){phaseText.textContent='味方フェイズ';phaseSub.textContent='敵の予告を見て、4人を自由な順番で行動させます。'}else if(state.phase==='enemy'){phaseText.textContent='敵フェイズ';phaseSub.textContent=state.activeEnemy?`${unit(state.activeEnemy)?.name||'敵'}が行動中`:'敵が素早さ順に行動しています。'}else if(state.phase==='win'){phaseText.textContent='作戦成功';phaseSub.textContent='制御端末を起動しました。'}else if(state.phase==='lose'){phaseText.textContent='作戦失敗';phaseSub.textContent='最初から再挑戦できます。'}}
enemyPhase.onclick=enemyTurn;$('reset').onclick=reset;undo.onclick=undoLast;reset();
})();
</script>
